name: Deploy to Azure VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-to-azure:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: env.HAS_SSH_KEY == 'true'
        env:
          HAS_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY != '' }}
        with:
          host: ${{ secrets.AZURE_VM_HOST || '172.198.73.188' }}
          username: ${{ secrets.AZURE_VM_USER || 'azureuser' }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: 22
          script: |
            cd /home/azureuser/FPV_Car/server
            ./deploy.sh
