<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090d16" />
  <title>🏎️ FPV Car Cloud Controller</title>
  <style>
    :root {
      --bg: #080c14;
      --card-bg: rgba(15, 23, 42, 0.75);
      --border: rgba(255, 255, 255, 0.1);
      --primary: #00f2fe;
      --primary-glow: rgba(0, 242, 254, 0.4);
      --accent: #4facfe;
      --danger: #f43f5e;
      --danger-glow: rgba(244, 63, 94, 0.4);
      --success: #10b981;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.08) 0%, transparent 70%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 14px;
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--primary);
    }

    .badge-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .badge.online {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--success);
      color: #34d399;
    }

    .badge.offline {
      background: rgba(244, 63, 94, 0.2);
      border-color: var(--danger);
      color: #fb7185;
    }

    /* Main Grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 1.15fr 1fr;
      }
    }

    /* Video Section */
    .video-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      background: #000;
      border: 2px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .video-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* AI Overlay Banner */
    .ai-hud-overlay {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .ai-pill {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      backdrop-filter: blur(8px);
      letter-spacing: 0.5px;
    }

    .ai-pill.clear {
      background: rgba(16, 185, 129, 0.7);
      color: #fff;
    }

    .ai-pill.obstacle {
      background: rgba(244, 63, 94, 0.85);
      color: #fff;
      animation: pulseAlert 1s infinite alternate;
    }

    .ai-pill.idle {
      background: rgba(15, 23, 42, 0.75);
      color: var(--text-muted);
    }

    @keyframes pulseAlert {
      from { transform: scale(1); box-shadow: 0 0 10px rgba(244, 63, 94, 0.5); }
      to { transform: scale(1.04); box-shadow: 0 0 20px rgba(244, 63, 94, 0.9); }
    }

    .video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #020617;
      color: var(--text-muted);
      gap: 6px;
    }

    /* Telemetry Mini Strip */
    .telemetry-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .tele-item .label {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 700;
      display: block;
      margin-bottom: 2px;
    }

    .tele-item .val {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--primary);
    }

    .tele-item .val.danger {
      color: var(--danger);
    }

    /* Actions Pill Bar */
    .actions-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .action-btn {
      flex: 1;
      min-width: 75px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      touch-action: manipulation;
      transition: all 0.15s;
    }

    .action-btn:active, .action-btn.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
      box-shadow: 0 0 14px var(--primary-glow);
    }

    .action-btn.horn:active, .action-btn.horn.active {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }

    /* Controller Card */
    .ctrl-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    /* Drive Mode Selector */
    .mode-selector {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .mode-tab {
      flex: 1;
      text-align: center;
      padding: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .mode-tab.active {
      background: var(--primary);
      color: #000;
      box-shadow: 0 2px 8px var(--primary-glow);
    }

    /* D-PAD Controls */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 76px);
      grid-template-rows: repeat(3, 76px);
      gap: 10px;
      justify-content: center;
      margin: 8px auto;
    }

    .d-btn {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 18px;
      color: #fff;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      transition: all 0.08s;
    }

    .d-btn:active, .d-btn.pressed {
      background: var(--primary);
      border-color: #fff;
      color: #000;
      transform: scale(0.92);
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .d-btn.stop {
      background: var(--danger);
      border-color: #fda4af;
      font-size: 1rem;
      font-weight: 900;
    }

    .d-btn.stop:active {
      background: #b91c1c;
    }

    /* Slider Box */
    .slider-wrap {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 10px;
    }

    .slider-wrap label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 4px;
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* Footer */
    .footer {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="header">
      <div class="brand">
        <span>🏎️</span>
        <span>FPV CONTROLLER</span>
      </div>
      <div class="badge-group">
        <span class="badge offline" id="statusBadge">● OFFLINE</span>
        <span class="badge" id="ipBadge" onclick="editCarIp()">IP: AUTO</span>
        <span class="badge" id="latencyBadge">⚡ --ms</span>
      </div>
    </header>

    <!-- Main Grid -->
    <div class="dashboard-grid">
      <!-- LEFT: Video & AI HUD -->
      <section class="video-card">
        <div class="video-wrapper">
          <img id="liveCam" src="" alt="FPV Live Camera Feed" />
          
          <div class="ai-hud-overlay">
            <span class="ai-pill idle" id="aiStatusPill">🛡️ AI: IDLE</span>
            <span class="ai-pill idle" id="aiLatencyPill">0ms</span>
          </div>

          <div class="video-placeholder" id="placeholder">
            <span style="font-size: 2rem;">📷</span>
            <span style="font-weight: 700; font-size: 0.9rem;" id="placeholderText">Camera Stream Disconnected</span>
            <button class="action-btn" onclick="startStream()" style="flex:none; padding:4px 12px; margin-top:4px;">RECONNECT</button>
          </div>
        </div>

        <!-- Telemetry Strip -->
        <div class="telemetry-strip">
          <div class="tele-item">
            <span class="label">ACTION</span>
            <span class="val" id="teleAction">IDLE</span>
          </div>
          <div class="tele-item">
            <span class="label">OBSTACLE</span>
            <span class="val" id="teleObstacle">CLEAR</span>
          </div>
          <div class="tele-item">
            <span class="label">AI MODE</span>
            <span class="val" id="teleAiMode">ASSIST</span>
          </div>
          <div class="tele-item">
            <span class="label">SPEED</span>
            <span class="val" id="teleSpeed">255</span>
          </div>
        </div>

        <!-- Quick Toggles -->
        <div class="actions-bar">
          <button class="action-btn active" id="camBtn" onclick="toggleCam()"><span>📹</span><span id="camBtnTxt">CAM ON</span></button>
          <button class="action-btn active" id="aiBtn" onclick="toggleAi()"><span>🤖</span><span id="aiBtnTxt">AI ON</span></button>
          <button class="action-btn" id="lightBtn" onclick="toggleLight()"><span>💡</span><span>LIGHT</span></button>
          <button class="action-btn horn" id="hornBtn" onpointerdown="sendHorn(1)" onpointerup="sendHorn(0)" onpointerleave="sendHorn(0)"><span>📢</span><span>HORN</span></button>
        </div>
      </section>

      <!-- RIGHT: Touch Controls -->
      <section class="ctrl-card">
        <div class="mode-selector">
          <div class="mode-tab active" id="modeHold" onclick="setDriveMode(0)">HOLD MODE</div>
          <div class="mode-tab" id="modeStep" onclick="setDriveMode(1)">STEP PULSE</div>
          <div class="mode-tab" id="modeAuto" onclick="toggleAutoMode()">AI ASSIST</div>
        </div>

        <!-- Tactile D-PAD -->
        <div class="dpad">
          <div></div>
          <button class="d-btn" onpointerdown="handlePress('F')" onpointerup="handleRelease('F')" onpointerleave="handleRelease('F')">▲</button>
          <div></div>

          <button class="d-btn" onpointerdown="handlePress('L')" onpointerup="handleRelease('L')" onpointerleave="handleRelease('L')">◀</button>
          <button class="d-btn stop" onclick="sendCmd('S')">STOP</button>
          <button class="d-btn" onpointerdown="handlePress('R')" onpointerup="handleRelease('R')" onpointerleave="handleRelease('R')">▶</button>

          <div></div>
          <button class="d-btn" onpointerdown="handlePress('B')" onpointerup="handleRelease('B')" onpointerleave="handleRelease('B')">▼</button>
          <div></div>
        </div>

        <!-- Speed Slider -->
        <div class="slider-wrap">
          <label><span>⚡ MOTOR SPEED PWM</span><span id="sliderVal">255</span></label>
          <input type="range" min="80" max="255" value="255" step="5" oninput="changeSpeed(this.value)" />
        </div>
      </section>
    </div>

    <footer class="footer">
      ⌨️ Controls: W, A, S, D / Arrow Keys to Drive | Space = STOP | H = Horn | L = Light
    </footer>
  </div>

  <script>
    // Configuration
    let carHost = localStorage.getItem("fpv_car_ip") || "10.172.34.222";
    let isCamOn = true;
    let isAiOn = true;
    let isLightOn = false;
    let isAutoMode = false;
    let driveMode = 0; // 0 = Hold, 1 = Step
    let activeDirection = 'S';
    let currentSpeed = 255;
    let lastPingTime = 0;

    // Elements
    const liveCam = document.getElementById("liveCam");
    const placeholder = document.getElementById("placeholder");
    const placeholderText = document.getElementById("placeholderText");
    const statusBadge = document.getElementById("statusBadge");
    const ipBadge = document.getElementById("ipBadge");
    const latencyBadge = document.getElementById("latencyBadge");
    const aiStatusPill = document.getElementById("aiStatusPill");
    const aiLatencyPill = document.getElementById("aiLatencyPill");
    const teleAction = document.getElementById("teleAction");
    const teleObstacle = document.getElementById("teleObstacle");
    const teleAiMode = document.getElementById("teleAiMode");
    const teleSpeed = document.getElementById("teleSpeed");
    const sliderVal = document.getElementById("sliderVal");

    ipBadge.textContent = "IP: " + carHost;

    function editCarIp() {
      const val = prompt("Enter Car Local IP Address (e.g. 10.172.34.222 or 192.168.4.1):", carHost);
      if (val && val.trim()) {
        carHost = val.trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '');
        localStorage.setItem("fpv_car_ip", carHost);
        ipBadge.textContent = "IP: " + carHost;
        sendServerReq(`/set.php?car_ip=${carHost}`);
        startStream();
      }
    }

    // ==========================================
    // Real-Time Video Stream
    // ==========================================
    let streamRetryTimer = null;
    let fallbackCaptureTimer = null;

    function startStream() {
      if (!isCamOn) {
        liveCam.src = "";
        placeholder.style.display = "flex";
        placeholderText.textContent = "Camera Turned Off (0% CPU)";
        aiStatusPill.className = "ai-pill idle";
        aiStatusPill.textContent = "🛡️ AI: CAM OFF";
        return;
      }

      clearTimeout(streamRetryTimer);
      clearTimeout(fallbackCaptureTimer);

      placeholder.style.display = "flex";
      placeholderText.textContent = "Connecting to Video Stream...";

      // Prefer local camera stream port 81 if available, fallback to server /cam/latest.jpg
      const streamUrl = `http://${carHost}:81/stream`;
      liveCam.src = streamUrl;

      liveCam.onload = () => {
        placeholder.style.display = "none";
        setOnline(true);
      };

      liveCam.onerror = () => {
        console.warn("[STREAM] Native stream unavailable, trying sequential capture...");
        // Sequential single-frame fallback (Never floods!)
        function pollFallback() {
          if (!isCamOn) return;
          const img = new Image();
          img.onload = () => {
            liveCam.src = img.src;
            placeholder.style.display = "none";
            setOnline(true);
            setTimeout(pollFallback, 50);
          };
          img.onerror = () => {
            placeholder.style.display = "flex";
            placeholderText.textContent = "Camera Sensor Offline / Check Ribbon Cable";
            setTimeout(pollFallback, 3000);
          };
          img.src = `http://${carHost}/capture?t=${Date.now()}`;
        }
        pollFallback();

        // Retry native port 81 every 6 seconds
        streamRetryTimer = setTimeout(startStream, 6000);
      };
    }

    // ==========================================
    // Fast Command Dispatcher (<2ms)
    // ==========================================
    function sendServerReq(url) {
      lastPingTime = performance.now();
      fetch(url, { keepalive: true, cache: 'no-store' })
        .then(r => {
          const lat = Math.round(performance.now() - lastPingTime);
          latencyBadge.textContent = `⚡ ${lat}ms`;
          setOnline(true);
        })
        .catch(() => {});
    }

    function sendCmd(cmd) {
      activeDirection = cmd;
      teleAction.textContent = cmd === 'S' ? 'STOP' : cmd;

      // 1. Direct to car local LAN (instant 0ms)
      if (carHost) {
        const u = `http://${carHost}/cmd?dir=${cmd}`;
        fetch(u, { mode: 'no-cors', keepalive: true }).catch(() => {
          new Image().src = u;
        });
      }

      // 2. Cloud Server relay
      sendServerReq(`/set.php?cmd=${cmd}`);
    }

    function handlePress(dir) {
      if (driveMode === 0) {
        // Hold mode
        sendCmd(dir);
      } else {
        // Step pulse mode
        sendCmd(dir);
        setTimeout(() => sendCmd('S'), 200);
      }
    }

    function handleRelease(dir) {
      if (driveMode === 0 && activeDirection === dir) {
        sendCmd('S');
      }
    }

    function sendHorn(v) {
      const u = `http://${carHost}/horn?val=${v}`;
      fetch(u, { mode: 'no-cors' }).catch(() => {});
      sendServerReq(`/set.php?horn=${v}`);
      document.getElementById("hornBtn").classList.toggle("active", v === 1);
    }

    function toggleLight() {
      isLightOn = !isLightOn;
      const v = isLightOn ? 1 : 0;
      fetch(`http://${carHost}/flash?val=${v}`, { mode: 'no-cors' }).catch(() => {});
      sendServerReq(`/set.php?flash=${v}`);
      document.getElementById("lightBtn").classList.toggle("active", isLightOn);
    }

    function toggleCam() {
      isCamOn = !isCamOn;
      document.getElementById("camBtn").classList.toggle("active", isCamOn);
      document.getElementById("camBtnTxt").textContent = isCamOn ? "CAM ON" : "CAM OFF";
      sendServerReq(`/set.php?cam=${isCamOn ? 1 : 0}`);
      startStream();
    }

    function toggleAi() {
      isAiOn = !isAiOn;
      document.getElementById("aiBtn").classList.toggle("active", isAiOn);
      document.getElementById("aiBtnTxt").textContent = isAiOn ? "AI ON" : "AI OFF";
      sendServerReq(`/set.php?ai=${isAiOn ? 1 : 0}`);
      updateAiUI();
    }

    function changeSpeed(val) {
      currentSpeed = val;
      sliderVal.textContent = val;
      teleSpeed.textContent = val;
      fetch(`http://${carHost}/speed?fs=${val}&bs=${val}`, { mode: 'no-cors' }).catch(() => {});
      sendServerReq(`/set.php?speed=${val}`);
    }

    function setDriveMode(m) {
      driveMode = m;
      document.getElementById("modeHold").classList.toggle("active", m === 0);
      document.getElementById("modeStep").classList.toggle("active", m === 1);
    }

    function toggleAutoMode() {
      isAutoMode = !isAutoMode;
      document.getElementById("modeAuto").classList.toggle("active", isAutoMode);
      teleAiMode.textContent = isAutoMode ? "AUTO-STOP" : "MANUAL";
      sendServerReq(`/set.php?mode=${isAutoMode ? 1 : 0}`);
    }

    function setOnline(online) {
      statusBadge.className = online ? "badge online" : "badge offline";
      statusBadge.textContent = online ? "● ONLINE" : "● OFFLINE";
    }

    function updateAiUI(state) {
      if (!isCamOn) {
        aiStatusPill.className = "ai-pill idle";
        aiStatusPill.textContent = "🛡️ AI: CAM OFF";
        teleObstacle.textContent = "IDLE";
        teleObstacle.className = "val";
        return;
      }
      if (!isAiOn) {
        aiStatusPill.className = "ai-pill idle";
        aiStatusPill.textContent = "🛡️ AI: OFF";
        teleObstacle.textContent = "DISABLED";
        teleObstacle.className = "val";
        return;
      }

      if (state && state.ai_obstacle === "1") {
        aiStatusPill.className = "ai-pill obstacle";
        aiStatusPill.textContent = `🚨 OBSTACLE DETECTED!`;
        teleObstacle.textContent = "DETECTED";
        teleObstacle.className = "val danger";
      } else {
        aiStatusPill.className = "ai-pill clear";
        aiStatusPill.textContent = "🛡️ PATH CLEAR";
        teleObstacle.textContent = "CLEAR";
        teleObstacle.className = "val";
      }

      if (state && state.ai_latency) {
        aiLatencyPill.textContent = state.ai_latency;
      }
    }

    // ==========================================
    // Real-Time WebSocket Connection
    // ==========================================
    let ws = null;
    function connectWS() {
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${proto}//${window.location.host}/ws`;
      try {
        ws = new WebSocket(wsUrl);
        ws.onopen = () => setOnline(true);
        ws.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            if (data.car_ip && data.car_ip.length >= 7 && data.car_ip !== carHost) {
              carHost = data.car_ip;
              localStorage.setItem("fpv_car_ip", carHost);
              ipBadge.textContent = "IP: " + carHost;
            }
            updateAiUI(data);
          } catch (err) {}
        };
        ws.onclose = () => {
          setTimeout(connectWS, 2500);
        };
      } catch (err) {
        setTimeout(connectWS, 3000);
      }
    }

    // Poll status fallback
    setInterval(() => {
      fetch(`./get.php?t=${Date.now()}`)
        .then(r => r.json())
        .then(data => {
          if (data.car_ip && data.car_ip.length >= 7 && data.car_ip !== carHost) {
            carHost = data.car_ip;
            localStorage.setItem("fpv_car_ip", carHost);
            ipBadge.textContent = "IP: " + carHost;
          }
          updateAiUI(data);
          setOnline(true);
        })
        .catch(() => {});
    }, 2000);

    // ==========================================
    // Keyboard Controller
    // ==========================================
    window.addEventListener("keydown", e => {
      if (e.repeat) return;
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') handlePress('F');
      else if (k === 's' || k === 'arrowdown') handlePress('B');
      else if (k === 'a' || k === 'arrowleft') handlePress('L');
      else if (k === 'd' || k === 'arrowright') handlePress('R');
      else if (k === ' ' || k === 'escape') sendCmd('S');
      else if (k === 'h') sendHorn(1);
      else if (k === 'l') toggleLight();
    });

    window.addEventListener("keyup", e => {
      const k = e.key.toLowerCase();
      if (['w', 's', 'a', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) {
        handleRelease(activeDirection);
      } else if (k === 'h') {
        sendHorn(0);
      }
    });

    // Initialize
    connectWS();
    startStream();
  </script>
</body>
</html>
